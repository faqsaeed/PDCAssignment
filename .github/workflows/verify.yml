name: Verify assignment build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget python3 python3-pip python3-venv
          wget -q https://github.com/ispc/ispc/releases/download/v1.31.0/ispc-v1.31.0-linux.tar.gz
          tar -xzf ispc-v1.31.0-linux.tar.gz
          echo "$PWD/ispc-v1.31.0-linux/bin" >> "$GITHUB_PATH"

      - name: Build all programs
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_all.sh

      - name: Program 1 correctness smoke test
        run: |
          cd prog1_mandelbrot_threads
          MANDELBROT_SCHEDULE=block ./mandelbrot -t 4
          ./mandelbrot -t 4

      - name: Program 2 tail correctness smoke test
        run: |
          cd prog2_vecintrin
          ./myexp -s 3

      - name: Program 3 task correctness smoke test
        run: |
          cd prog3_mandelbrot_ispc
          ./mandelbrot_ispc --tasks --num-tasks 8

      - name: Program 4 input-mode smoke test
        run: |
          cd prog4_sqrt
          ./sqrt --case uniform
          ./sqrt --case divergent

      - name: Program 5 smoke test
        run: |
          cd prog5_saxpy
          ./saxpy

      - name: Program 6 small-data correctness smoke test
        run: |
          cd prog6_kmeans
          python3 -m venv venv
          source venv/bin/activate
          pip install -q numpy matplotlib scikit-learn
          python3 generate_data.py --small
          KMEANS_THREADS=1 ./kmeans
          KMEANS_THREADS=4 ./kmeans
          python3 plot.py
